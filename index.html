<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hardware Store Cash Book</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar no-print">
    <button type="button" id="menu-btn" class="btn" aria-label="Open menu">&#9776; Menu</button>
    <span id="topbar-title" class="topbar-title"></span>
  </div>

  <aside id="sidebar" class="sidebar no-print">
    <div class="brand">
      <strong id="brand-name">Hardware Store</strong>
      <small>Cash Book</small>
    </div>
    <nav id="nav" aria-label="Main menu"></nav>
    <div class="sidebar-foot">
      <div id="userbox"></div>
      <div id="backup-indicator"></div>
      <div>Works without internet</div>
    </div>
  </aside>
  <div id="backdrop" class="backdrop no-print"></div>

  <div id="auth" class="auth-screen" hidden></div>

  <main class="content">
    <div id="banner"></div>
    <div id="content"></div>
  </main>

  <div id="toasts" class="no-print" aria-live="polite"></div>

  <noscript><p style="padding:20px">Please turn on JavaScript in your browser to use this software.</p></noscript>

  <script src="assets/lib/pdf-lib.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/autobackup.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reportkit.js"></script>
  <script src="js/app.js"></script>
  <script src="js/parties.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/income.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/suppliers.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/cashbook.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/users.js"></script>
  <script>App.init();</script>
</body>
</html>
